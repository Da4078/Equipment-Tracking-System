
  services:
    postgres:
      image: postgres:17-alpine
      container_name: equipment-db
      ports:
        - "5433:5432"
      environment:
        POSTGRES_DB: equipment_db
        POSTGRES_USER: daniel
        POSTGRES_PASSWORD: password
      volumes:
        - postgres_data:/var/lib/postgresql/data

    keycloak:
      image: quay.io/keycloak/keycloak:26.3
      container_name: equipment-keycloak
      command:
        - start-dev
        - --http-port=8080
      environment:
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
        KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
        KC_HOSTNAME: http://localhost:8082
      ports:
        - "8082:8080"

    app:
      build: .
      container_name: equipment-app
      depends_on:
        - postgres
        - keycloak
      environment:
        SPRING_PROFILES_ACTIVE: docker

        DB_HOST: postgres
        DB_PORT: 5432
        DB_NAME: equipment_db
        DB_USER: daniel
        DB_PASSWORD: password

        SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://host.docker.internal:8082/realms/equipment-tracker

      extra_hosts:
        - "host.docker.internal:host-gateway"

      ports:
        - "8081:8080"

  volumes:
    postgres_data:
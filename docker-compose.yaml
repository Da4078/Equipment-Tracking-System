services:
  postgres:
    image: postgres:17-alpine
    container_name: equipment-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: equipment_db
      POSTGRES_USER: daniel
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build:  .
    container_name: equipment-app
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: equipment_db
      DB_USER: daniel
      DB_PASSWORD: password
    ports:
      - "8081:8080"
volumes:
  postgres_data:
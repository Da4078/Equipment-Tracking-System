spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:equipment_db}
    username: ${DB_USER:daniel}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  data:
    web:
      pageable:
        one-indexed-parameters: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:  ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8082/realms/equipment-tracker}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

keycloak:
  server-url: http://localhost:8082
  realm: equipment-tracker
  admin-username: admin
  admin-password: admin123
  admin-client-id: admin-cli

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org:
      springframework:
        security: TRACE

server:
  port: 8080


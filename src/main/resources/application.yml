spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/equipment_db
    username: daniel
    password: password
    driver-class-name: org.postgresql.Driver

  data:
    web:
      pageable:
        one-indexed-parameters: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql:true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
    swagger-ui:
      path: /swagger-ui.html
    api-docs:
      path: /v3/api-docs

logging:
  level:
    org:
      springframework:
        security: INFO
server:
  port: 8080

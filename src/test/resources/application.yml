spring:
  datasource:
    url: jdbc:h2:mem:equipment_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false